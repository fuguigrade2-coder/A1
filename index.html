/* =========================================================================
   2. 繁體中文標準向量筆順庫與幾何筆畫拆解引擎
   ========================================================================= */
const charDataCache = {};

async function fetchCharStrokes(ch) {
  if (charDataCache[ch]) return charDataCache[ch];
  const urls = [
    `https://cdn.jsdelivr.net/npm/hanzi-writer-data-traditional@2.0/${encodeURIComponent(ch)}.json`,
    `https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/${encodeURIComponent(ch)}.json`
  ];
  for (const url of urls) {
    try {
      const res = await fetch(url);
      if (res.ok) {
        const raw = await res.json();
        charDataCache[ch] = raw;
        return raw;
      }
    } catch (e) {}
  }
  throw new Error(`字庫缺少「${ch}」的標準筆順向量，建議刪除`);
}

function convertPathTo2048(dStr) {
  const tokens = dStr.match(/[a-zA-Z]|-?\d+(?:\.\d+)?/g);
  if (!tokens) return "";
  let out = "", idx = 0;
  while (idx < tokens.length) {
    const token = tokens[idx++];
    if (/^[a-zA-Z]$/.test(token)) {
      out += token;
      if (token === 'Z' || token === 'z') continue;
      while (idx < tokens.length && !/^[a-zA-Z]$/.test(tokens[idx])) {
        const x = Math.round(parseFloat(tokens[idx++]) * 2);
        const y = Math.round((900 - parseFloat(tokens[idx++])) * 2);
        out += `${x} ${y} `;
      }
      out = out.trimEnd();
    }
  }
  return out;
}

function convertMediansTo2048(medians) {
  return medians.map(pt => [
    Math.round(pt[0] * 2),
    Math.round((900 - pt[1]) * 2)
  ]);
}

function getStrokeFeature(t) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, len = 0;
  for (let i = 0; i < t.length; i++) {
    const [x, y] = t[i];
    if (x < minX) minX = x;
    if (y < minY) minY = y;
    if (x > maxX) maxX = x;
    if (y > maxY) maxY = y;
    if (i > 0) len += Math.hypot(x - t[i-1][0], y - t[i-1][1]);
  }
  const start = t[0], end = t[t.length - 1];
  return {
    minX, minY, maxX, maxY,
    cx: (minX + maxX) / 2,
    cy: (minY + maxY) / 2,
    dx: end[0] - start[0],
    dy: end[1] - start[1],
    len: Math.max(len, 1)
  };
}

function computePartBBox(strokeList, pi) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const indices = pi && pi.length ? pi : strokeList.map((_, i) => i);
  indices.forEach(idx => {
    const s = strokeList[idx];
    if (!s) return;
    const nums = s.d.match(/-?\d+/g);
    if (nums) {
      for (let i = 0; i < nums.length; i += 2) {
        const x = parseInt(nums[i], 10), y = parseInt(nums[i+1], 10);
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
      }
    }
  });
  if (minX === Infinity) return [150, 200, 850, 1800];
  return [minX, minY, maxX, maxY];
}

async function askAIForStrokeSplit(sharedChar, rounds, strokesMap) {
  const strokeDescriptions = rounds.map(r => {
    const sList = strokesMap[r.ch] || [];
    const details = sList.map((s, idx) => {
      const f = getStrokeFeature(s.t);
      const xPct = Math.round((f.cx / 2048) * 100);
      const yPct = Math.round((f.cy / 2048) * 100);
      const dir = Math.abs(f.dx) > Math.abs(f.dy)
        ? (f.dx > 0 ? "橫/撇折右" : "撇/向左")
        : (f.dy > 0 ? "豎/捺/向下" : "挑/向上");
      return `第${idx}筆(中心X:${xPct}%,Y:${yPct}%,方向:${dir})`;
    }).join("、");
    return `【目標字「${r.ch}」】共 ${sList.length} 筆｜需拆出的部件為「${r.part}」（${r.meaning}），共同保留的聲旁為「${sharedChar}」。筆畫列表：${details}`;
  }).join("\n");

  const systemPrompt = `你是一位精通台灣標準國字筆順與漢字部件結構的專家。
現在我們正在製作「形近字拼拼樂」遊戲：
- 「共同保留的聲旁（${sharedChar}）」會留在上方大字格中（顯示為藍色）。
- 「不保留的部件（part）」要被拆出來放到下方當作拖曳選項（顯示為橘色）。

請你仔細閱讀每個目標字的真實筆順編號（從 0 開始）與每筆的中心座標 (X%, Y%)、筆畫方向，精準判斷哪些筆畫編號屬於「不保留的部件（partStrokeIndices）」，其餘筆畫即為共同保留的「${sharedChar}」！

【重要判斷範例】：
1. 一般左形右聲字（如「晴」= 日 + 青，共12筆）：左邊「日」（X約20~35%）是第 0,1,2,3 筆，右邊「青」（X約55~80%）是第 4~11 筆 -> partStrokeIndices 為 [0,1,2,3]。
2. 左中右夾心結構（如「辦」= 辛 + 力 + 辛，共16筆）：
   - 左邊「辛」（X約15~32%）是第 0~6 筆（保留！）
   - 中間「力」（X約42~58%）是第 7, 8 筆（不保留，要拆出來！）
   - 右邊「辛」（X約68~88%）是第 9~15 筆（保留！）
   -> 因此 partStrokeIndices 為 [7, 8]！
3. 同理「辨」(中間刂為第7,8筆)、「辯」(中間言為第7~13筆)、「瓣」(中間瓜為第7~11筆)、「辮」(中間糸為第7~12筆)，都是把正中央（X約40~60%）的部件筆畫編號放入 partStrokeIndices，左右兩側的「辛」全部保留！
4. 上形下聲（如「花」= 艹 + 化）：上方 Y% 較小的「艹」筆畫編號放入 partStrokeIndices。

請務必確保每個字的 partStrokeIndices 數量合理（至少 1 筆，且不能把所有筆畫都選走）。`;

  const schema = {
    type: "OBJECT",
    properties: {
      splits: {
        type: "ARRAY",
        items: {
          type: "OBJECT",
          properties: {
            ch: { type: "STRING" },
            partStrokeIndices: {
              type: "ARRAY",
              items: { type: "INTEGER" },
              description: "屬於不保留部件（要拆到下方當橘色部件）的筆畫索引陣列（0-based）"
            }
          },
          required: ["ch", "partStrokeIndices"]
        }
      }
    },
    required: ["splits"]
  };

  const apiKey = "";
  const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
  const payload = {
    contents: [{ role: "user", parts: [{ text: `請幫我判斷以下每個字的哪些筆畫編號屬於「不保留的部件」：\n${strokeDescriptions}` }] }],
    systemInstruction: { parts: [{ text: systemPrompt }] },
    generationConfig: {
      responseMimeType: "application/json",
      responseSchema: schema
    }
  };

  const response = await fetch(apiUrl, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  if (!response.ok) throw new Error("AI 筆畫分析連線失敗");
  const result = await response.json();
  const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
  return JSON.parse(text).splits || [];
}

async function hydrateStrokesForD(dataObj, onProgress) {
  dataObj.strokes = {};
  const validRounds = [];

  for (let idx = 0; idx < dataObj.rounds.length; idx++) {
    const r = dataObj.rounds[idx];
    if (onProgress) onProgress(`正在載入「${r.ch}」的繁體標準向量筆順 (${idx + 1}/${dataObj.rounds.length})...`, 40 + Math.round(((idx + 1) / dataObj.rounds.length) * 30));
    try {
      const rawChar = await fetchCharStrokes(r.ch);
      const cStrokes = rawChar.strokes.map((d, i) => ({
        d: convertPathTo2048(d),
        t: convertMediansTo2048(rawChar.medians[i])
      }));
      dataObj.strokes[r.ch] = cStrokes;
      validRounds.push(r);
    } catch (err) {
      console.warn(`跳過無法取得筆畫的字: ${r.ch}`, err);
    }
  }

  if (validRounds.length < 2) {
    throw new Error("有效字數不足，請嘗試輸入常見的形聲字（如：晴、抱、河、橋）");
  }
  dataObj.rounds = validRounds;

  const needsAISplit = dataObj.rounds.some(r => !Array.isArray(r.pi) || r.pi.length === 0 || r.pi.some(k => k >= dataObj.strokes[r.ch].length));

  if (needsAISplit) {
    if (onProgress) onProgress(`AI 正在逐筆分析「${dataObj.shared}」字族的筆順結構，決定保留與拆出的部件筆畫...`, 82);
    try {
      const splits = await askAIForStrokeSplit(dataObj.shared, dataObj.rounds, dataObj.strokes);
      dataObj.rounds.forEach(r => {
        const sLen = dataObj.strokes[r.ch].length;
        const found = splits.find(sp => sp.ch === r.ch);
        if (found && Array.isArray(found.partStrokeIndices)) {
          const cleanPi = [...new Set(found.partStrokeIndices)]
            .filter(k => Number.isInteger(k) && k >= 0 && k < sLen)
            .sort((a, b) => a - b);
          if (cleanPi.length > 0 && cleanPi.length < sLen) {
            r.pi = cleanPi;
          }
        }
        if (!Array.isArray(r.pi) || r.pi.length === 0 || r.pi.length >= sLen) {
          r.pi = Array.from({length: Math.max(1, Math.min(3, sLen - 2))}, (_, i) => i);
        }
      });
    } catch (e) {
      console.warn("AI 筆畫切分發生錯誤，套用基礎切分", e);
      dataObj.rounds.forEach(r => {
        const sLen = dataObj.strokes[r.ch].length;
        r.pi = Array.from({length: Math.max(1, Math.min(3, sLen - 2))}, (_, i) => i);
      });
    }
  }

  dataObj.rounds.forEach(r => {
    r.rb = computePartBBox(dataObj.strokes[r.ch], r.pi);
  });

  return dataObj;
}

   3. Gemini AI 兩階段出題引擎
   ========================================================================= */
const apiKey = "";
const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

async function callGeminiJSON(systemPrompt, userText, responseSchema) {
  const payload = {
    contents: [{ role: "user", parts: [{ text: userText }] }],
    systemInstruction: { parts: [{ text: systemPrompt }] },
    generationConfig: {
      responseMimeType: "application/json",
      responseSchema: responseSchema
    }
  };
  let lastErr = null;
  for (let attempt = 0; attempt < 4; attempt++) {
    try {
      const response = await fetch(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error(`API HTTP ${response.status}`);
      const result = await response.json();
      const jsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!jsonText) throw new Error("AI 回傳格式空白");
      return JSON.parse(jsonText);
    } catch (e) {
      lastErr = e;
      await new Promise(r => setTimeout(r, 1000 * Math.pow(2, attempt)));
    }
  }
  throw lastErr;
}

注意：必須全部使用繁體中文，且每個字都確實包含該共用部件。`;

async function generateFullGameFromConfirmedChars(sharedChar, confirmedItems) {
  const charSummary = confirmedItems.map(it => `${it.ch}（部首：${it.part}，位置：${it.partPos || 'auto'}，意義：${it.meaning}）`).join('、');

  const systemPrompt = `你是一位專精於台灣國小國語文識字教學的資深教材設計師。
使用者已經確認好共用聲旁「${sharedChar}」的形近字清單：${charSummary}。
請為這組確認好的字族，設計完整的「形近字家族拼拼樂」遊戲題庫 JSON：
1. title: 例如「${sharedChar}字家族拼拼樂：形近字拖曳配對」
2. shared: "${sharedChar}"
3. rounds: 嚴格按照使用者確認的清單順序與字數生成每一題，每題包含：
   - ch: 該繁體字
   - zhuyin: 該字的台灣教育部標準注音（例如「ㄑㄧㄥˊ」）
   - part: 該字的部首／意符部件（例如「氵」、「日」、「忄」、「言」）
   - partPos: 部首空間位置（left, right, top, bottom, middle, surround；例如「辦/辨/辯/瓣/辮」的力/刂/言/瓜/糸夾在兩個辛中間，必為 "middle"）
   - meaning: 該部首給小朋友的直白意義（2~4個字，例如「水」、「太陽」、「心」、「說話」）
   - emoji: 最能代表該部首意義的單一 Emoji（例如「💧」、「☀️」、「❤️」、「💬」）
   - word: 包含該字的常見雙字或四字語詞（例如「晴天」、「擁抱」、「預防」、「拜訪」）
   - wordZ: 該語詞的完整台灣注音，字與字之間空一格（例如「ㄑㄧㄥˊ ㄊㄧㄢ」）
   - sent: 陣列，固定 2 個字串 [挖空處前面的句子, 挖空處後面的句子]。
     【極重要規則】：挖空框（❓）只代表單一目標字 ch 本身，絕對不是整個語詞 word！因此 sent[0] 與 sent[1] 必須保留該語詞中的「其他字」！
     ✅ 正確範例（目標字 ch="防", 語詞 word="預防"）：["勤洗手可以預", "感冒病毒的入侵。"]
     ✅ 正確範例（目標字 ch="訪", 語詞 word="拜訪"）：["過年時，爸爸帶我去拜", "親戚好友家。"]
     ❌ 錯誤範例：["勤洗手可以", "感冒病毒的入侵。"]（缺少「預」字）
   - about: 這句話在說什麼的簡短提示（3~7個字，例如「出太陽的好天氣」）
   - why: 答對後的部件造字原理解釋（例如「出太陽的好天氣，和「太陽」有關！」）
   - scene: 情境插圖設定，畫布為 240x140，包含 bg (柔和淺色HEX背景)、ground (草地HEX，室外場景填寫)、floor (室內地板HEX，室內場景填寫)、water (布林值)、sun (布林值)、items (3~4個插圖物件，包含 emoji、x(30~210)、y(35~115)、size(24~48))。`;

  const responseSchema = {
    type: "OBJECT",
    properties: {
      title: { type: "STRING" },
      shared: { type: "STRING" },
      rounds: {
        type: "ARRAY",
        items: {
          type: "OBJECT",
          properties: {
            ch: { type: "STRING" },
            zhuyin: { type: "STRING" },
            part: { type: "STRING" },
            partPos: { type: "STRING" },
            meaning: { type: "STRING" },
            emoji: { type: "STRING" },
            word: { type: "STRING" },
            wordZ: { type: "STRING" },
            sent: { type: "ARRAY", items: { type: "STRING" } },
            about: { type: "STRING" },
            why: { type: "STRING" },
            scene: {
              type: "OBJECT",
              properties: {
                bg: { type: "STRING" },
                ground: { type: "STRING" },
                floor: { type: "STRING" },
                water: { type: "BOOLEAN" },
                sun: { type: "BOOLEAN" },
                items: {
                  type: "ARRAY",
                  items: {
                    type: "OBJECT",
                    properties: {
                      emoji: { type: "STRING" },
                      x: { type: "INTEGER" },
                      y: { type: "INTEGER" },
                      size: { type: "INTEGER" }
                    },
                    required: ["emoji", "x", "y", "size"]
                  }
                }
              },
              required: ["bg", "items"]
            }
          },
          required: ["ch", "zhuyin", "part", "partPos", "meaning", "emoji", "word", "wordZ", "sent", "about", "why", "scene"]
        }
      }
    },
    required: ["title", "shared", "rounds"]
  };

  const parsed = await callGeminiJSON(systemPrompt, `請為「${sharedChar}」字族的這 ${confirmedItems.length} 個字（${confirmedItems.map(i=>i.ch).join('、')}）生成完整遊戲教材。`, responseSchema);

  parsed.rounds.forEach((r, idx) => {
    if (!r.partPos && confirmedItems[idx]?.partPos) r.partPos = confirmedItems[idx].partPos;
    if (r.scene && Array.isArray(r.scene.items)) {
      r.scene.items = r.scene.items.map(it => Array.isArray(it) ? it : [it.emoji || "✨", it.x || 100, it.y || 80, it.size || 32]);
    }
    if (!Array.isArray(r.sent) || r.sent.length < 2) {
      r.sent = [r.sent?.[0] || "我們一起來學", "這個字吧！"];
    }
    if (r.word && r.ch && r.word.includes(r.ch)) {
      const [wPre, wPost] = r.word.split(r.ch);
      if (wPre && !r.sent[0].endsWith(wPre)) {
        r.sent[0] = r.sent[0] + wPre;
      }
      if (wPost && !r.sent[1].startsWith(wPost)) {
        r.sent[1] = wPost + r.sent[1];
      }
    }
  });
  return parsed;
}

            <span class="text-xs font-black px-2 py-0.5 rounded-full bg-red-200 text-red-800">⚠️ 不可用</span>
          </div>
          <div class="mt-1.5 text-xs font-black text-red-600 leading-snug">
            ${item.reason || '不符合字族條件，請刪除'}
          </div>
          <button data-del="${idx}" class="mt-2 w-full py-1 rounded-lg bg-red-600 text-white text-xs font-black hover:bg-red-700">點擊刪除</button>
        </div>`;
      }
    }).join('');
  }

  listEl.querySelectorAll('button[data-del]').forEach(btn => {
    btn.onclick = () => {
      ac();
      const idx = +btn.dataset.del;
      reviewState.items.splice(idx, 1);
      SFX.back();
      renderReviewModal();
    };
  });

  const invalidCount = reviewState.items.filter(x => !x.valid).length;
  const validCount = reviewState.items.filter(x => x.valid).length;
  const confirmBtn = $('#confirmReviewBtn');

  if (invalidCount > 0) {
    confirmBtn.disabled = true;
    confirmBtn.textContent = `⚠️ 請先刪除 ${invalidCount} 個不可用的字`;
  } else if (validCount < 2) {
    confirmBtn.disabled = true;
    confirmBtn.textContent = `⚠️ 至少需要保留 2 個字`;
  } else {
    confirmBtn.disabled = false;
    confirmBtn.textContent = `🚀 確認這 ${validCount} 個字，生成遊戲！`;
  }
}

async function openReviewStep(seedWord) {
  const cleanInput = seedWord.trim();
  if (!cleanInput) return;
  const targetChar = [...cleanInput][0];
  if ($('#homeError')) $('#homeError').classList.add('hidden');
  if ($('#addCharMsg')) $('#addCharMsg').classList.add('hidden');
  if ($('#addCharInput')) $('#addCharInput').value = '';

  try {
    setLoading(true, `AI 正在分析「${targetChar}」的共用聲旁與推薦形近字清單...`, 35);
    const data = await fetchCandidateListFromAI(targetChar);
    const shared = (data.shared || targetChar).trim();

    setLoading(true, `正在驗證推薦字卡的繁體筆順資料...`, 75);
    const checkedItems = [];
    for (const c of (data.candidates || [])) {
      const ch = (c.ch || '').trim();
      if (!ch || ch === shared || checkedItems.some(x => x.ch === ch)) continue;
      let strokeOk = true, strokeReason = "";
      try {
        await fetchCharStrokes(ch);
      } catch (e) {
        strokeOk = false;
        strokeReason = e.message;
      }
      checkedItems.push({
        ch,
        part: c.part || "部首",
        partPos: c.partPos || "",
        meaning: c.meaning || "意義",
        valid: strokeOk,
        reason: strokeReason
      });
    }

    reviewState = { shared, items: checkedItems };
    setLoading(false);
    renderReviewModal();
    $('#reviewModal').classList.remove('hidden');
    SFX.select();
  } catch (err) {
    setLoading(false);
    showHomeError(`哎呀！分析「${targetChar}」時發生錯誤：${err.message}`);
  }
}

async function handleAddNewChars() {
  const raw = $('#addCharInput').value.trim();
  const msgEl = $('#addCharMsg');
  if (!raw) return;

  const chars = [...new Set([...raw].filter(c => !/[\s、,，。；;0-9a-zA-Z]/.test(c)))];
  if (chars.length === 0) {
    msgEl.className = "mt-2 text-xs font-bold rounded-lg px-3 py-1.5 bg-red-100 text-red-700";
    msgEl.textContent = "⚠️ 請輸入有效的繁體中文字！";
    msgEl.classList.remove('hidden');
    return;
  }

  const existing = reviewState.items.map(x => x.ch);
  const toCheck = [];
  for (const ch of chars) {
    if (existing.includes(ch)) {
      msgEl.className = "mt-2 text-xs font-bold rounded-lg px-3 py-1.5 bg-amber-100 text-amber-800";
      msgEl.textContent = `💡 「${ch}」已經在清單裡面囉！`;
      msgEl.classList.remove('hidden');
    } else if (ch === reviewState.shared) {
      reviewState.items.push({ ch, part: "", partPos: "", meaning: "", valid: false, reason: `與共用聲旁「${reviewState.shared}」相同，沒有部首可拆，請刪除` });
    } else {
      toCheck.push(ch);
    }
  }

  if (toCheck.length === 0) {
    $('#addCharInput').value = '';
    renderReviewModal();
    return;
  }

  const addBtn = $('#addCharBtn');
  addBtn.disabled = true;
  addBtn.textContent = "⏳ AI 檢查中...";
  msgEl.classList.add('hidden');

  try {
    const aiRes = await validateAddedCharsWithAI(reviewState.shared, existing, toCheck);
    let hasInvalid = false;

    for (const r of (aiRes.results || [])) {
      let valid = !!r.valid;
      let reason = r.reason || "";
      if (valid) {
        try {
          await fetchCharStrokes(r.ch);
        } catch (e) {
          valid = false;
          reason = e.message;
        }
      }
      if (!valid) hasInvalid = true;
      reviewState.items.push({
        ch: r.ch,
        part: r.part || "部首",
        partPos: r.partPos || "",
        meaning: r.meaning || "意義",
        valid,
        reason
      });
    }

    $('#addCharInput').value = '';
    renderReviewModal();

    if (hasInvalid) {
      SFX.wrong();
      msgEl.className = "mt-2 text-xs font-black rounded-lg px-3 py-2 bg-red-100 text-red-700 border border-red-300";
      msgEl.textContent = "⚠️ 偵測到不可用的字（已用紅框標示），請點擊該字卡的「刪除」按鈕移除後再繼續！";
      msgEl.classList.remove('hidden');
    } else {
      SFX.correct();
      msgEl.className = "mt-2 text-xs font-black rounded-lg px-3 py-1.5 bg-emerald-100 text-emerald-800";
      msgEl.textContent = "✅ 檢查通過！已成功加入可用形近字清單。";
      msgEl.classList.remove('hidden');
    }
  } catch (err) {
    msgEl.className = "mt-2 text-xs font-bold rounded-lg px-3 py-1.5 bg-red-100 text-red-700";
    msgEl.textContent = `檢查時發生錯誤：${err.message}`;
    msgEl.classList.remove('hidden');
  } finally {
    addBtn.disabled = false;
    addBtn.textContent = "🔍 新增並檢查";
  }
}

async function finalizeAndStartGame() {
  const validItems = reviewState.items.filter(x => x.valid);
  if (validItems.length < 2) return;

  $('#reviewModal').classList.add('hidden');
  stopStrokes(); stopSpeak(); hideFeedback(); $('#overlay').classList.add('hidden');

  try {
    setLoading(true, `AI 正在為這 ${validItems.length} 個字編寫國小低年級造句、注音與情境插圖...`, 25);
    const newD = await generateFullGameFromConfirmedChars(reviewState.shared, validItems);

    setLoading(true, `正在下載「${newD.shared}」字族的繁體向量筆順並拆解部首...`, 55);
    await hydrateStrokesForD(newD, (msg, pct) => setLoading(true, msg, pct));

    D = newD;
    if ($('#charInput')) $('#charInput').value = D.rounds[0]?.ch || D.shared;
    round = 0;
    openStudyScreen(true);
    setLoading(false);
    SFX.correct();
  } catch (err) {
    setLoading(false);
    showHomeError(`生成遊戲時發生錯誤：${err.message}`);
  }
}

let AC, noiseBuf;
function ac(){ try{ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} return AC; }
function tone(f,t0,dur,type='sine',vol=.2,f2){ const a=ac(); if(!a||muted) return;
  const o=a.createOscillator(), g=a.createGain(), t=a.currentTime+t0; o.type=type;
  o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(a.destination); g.connect(wet()); o.start(t); o.stop(t+dur+.05); }
let REV=null;
function wet(){ const a=AC; if(!REV){ REV=a.createConvolver(); const len=a.sampleRate*1.4|0, b=a.createBuffer(2,len,a.sampleRate);
  for(let c=0;c<2;c++){ const d=b.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2); }
  REV.buffer=b; const g=a.createGain(); g.gain.value=.22; REV.connect(g).connect(a.destination); } return REV; }
function noise(t0,dur,vol=.3,freq=1500,q=1,typ='bandpass'){ const a=ac(); if(!a||muted) return;
  if(!noiseBuf){ noiseBuf=a.createBuffer(1,a.sampleRate,a.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain(), t=a.currentTime+t0;
  s.buffer=noiseBuf; f.type=typ; f.frequency.value=freq; f.Q.value=q;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g); g.connect(a.destination); g.connect(wet()); s.start(t,Math.random()*.5); s.stop(t+dur+.05); }
const SFX = {

  select(){ tone(700,0,.08,'sine',.15); tone(1050,.07,.1,'sine',.12); },
  back(){ tone(420,0,.18,'triangle',.15,200); },
  snap(){ tone(880,0,.08,'square',.06); tone(1320,.05,.12,'sine',.15); },
  correct(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.28,'triangle',.22)); tone(1568,.38,.5,'sine',.12); },
  wrong(){ tone(330,0,.38,'sine',.18,150); tone(336,0,.38,'square',.05,152); tone(180,.4,.2,'triangle',.12,120); },
  tick(){ noise(0,.09,.15,2600,.7); tone(1200,0,.04,'sine',.04); },

  firework(){ tone(500,0,.55,'sine',.05,1700); noise(.55,.9,.55,260,.6,'lowpass'); noise(.6,.7,.18,3200,.5); },
  fanfare(){ [[523,0],[659,.14],[784,.28],[1047,.42],[880,.62],[1047,.76],[1319,.9]].forEach(([f,t])=>tone(f,t,.32,'triangle',.2)); },
  kick(t=0,v=.55){ const a=ac(); if(!a||muted) return; const o=a.createOscillator(), g=a.createGain(), T=a.currentTime+t;
    o.frequency.setValueAtTime(160,T); o.frequency.exponentialRampToValueAtTime(45,T+.15); g.gain.setValueAtTime(v,T); g.gain.exponentialRampToValueAtTime(.0001,T+.2);
    o.connect(g); g.connect(a.destination); o.start(T); o.stop(T+.25); },
  mallet(f,t=0,v=.2){ tone(f,t,.8,'sine',v); tone(f*2,t,.35,'triangle',v*.18); tone(f*4,t,.1,'sine',v*.2); },
  clap(t=0){ noise(t,.07,.55,1300,.9); noise(t+.014,.06,.4,2300,.9); },
  good(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>SFX.mallet(f,i*.075,.22));
    [2093,2637,3136,4186].forEach((f,i)=>tone(f,.32+i*.05,1.1,'sine',.035));
    SFX.clap(.55); SFX.clap(.6);

  if(sc.water) g+=`<path d="M0 82 q60 -12 120 0 t120 0 v60 H0z" fill="#7fd1ff"/><path d="M14 100 q15 -6 30 0 M100 114 q15 -6 30 0 M176 102 q15 -6 30 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>`;

$('#tray').addEventListener('pointerdown', e=>{

function playStrokes(){

  const r=D.rounds[round], S=strokes(r.ch), ga=$('#gAnim');
  $('#gShared').style.opacity=.12; $('#gPart').style.opacity=.12; ga.innerHTML='';
  let t=0;
  S.forEach((s,k)=>{
    const col = r.pi.includes(k) ? '#ef5a0c' : '#1d63d8';
    const cp=document.createElementNS(NS,'clipPath'); cp.id='cp'+k; cp.innerHTML=`<path d="${s.d}"/>`; ga.appendChild(cp);
    const pts=s.t.map(p=>p[0]+' '+p[1]).join(' L ');
    const line=document.createElementNS(NS,'path'); line.setAttribute('d','M '+pts);
    Object.assign(line.style,{fill:'none',stroke:col,strokeWidth:260,strokeLinecap:'round',strokeLinejoin:'round'});
    line.setAttribute('clip-path',`url(#cp${k})`); ga.appendChild(line);
    const L=line.getTotalLength()+260, dur=Math.max(.35, L/2400);
    line.style.strokeDasharray=L; line.style.strokeDashoffset=L;

function cleanSpoken(str){
  let s = str || '';
  const SYMBOL_ONLY_SPOKEN = {
    "氵": "三點水", "扌": "提手旁", "忄": "豎心旁", "亻": "單人旁",
    "訁": "言字旁", "飠": "食字旁", "糸": "絞絲旁", "糹": "絞絲旁",
    "艹": "草字頭", "宀": "寶蓋頭", "穴": "穴寶蓋", "⺮": "竹字頭",
    "辶": "走之旁", "阝": "耳朵旁", "犭": "反犬旁", "礻": "示字旁",
    "衤": "衣字旁", "冫": "兩點水", "冖": "禿寶蓋", "广": "廣字旁",
    "疒": "病字旁", "彳": "雙人旁", "灬": "四點火", "刂": "立刀旁",
    "罒": "網字頭", "釒": "金字旁"
  };
  Object.entries(SYMBOL_ONLY_SPOKEN).forEach(([sym, spoken]) => {
    s = s.split(sym).join(spoken);
  });
  return s
    .replace(/「([^」]+)」/g, '$1')
    .replace(/＋/g, '加')
    .replace(/＝/g, '等於')
    .replace(/❓/g, '問號')
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '')
    .replace(/\s+/g, ' ')
    .trim();
}
async function speakFrogBubble(){
  if(!TTS.ok){ say('這台裝置不能念讀 😢<br>可以換 Chrome 或 Edge 試試看。','oops','oops'); return; }
  const msgEl = document.querySelector('#bubble .bubble-msg');
  if(!msgEl) return;
  stopSpeak();
  const seq = speakSeq;
  const btn = $('#frogSpeakBtn');
  if(btn) btn.classList.add('on');

  const formulaEl = document.getElementById('fbFormula');
  const whyEl = document.getElementById('fbWhy');

  if(formulaEl && whyEl){
    const r = D.rounds[round];
    const partSpoken = PART_SPOKEN_NAMES[r.part] || r.part;
    const formulaSpeech = `${partSpoken}，${r.meaning}的意思。${partSpoken}加${D.shared}等於${r.ch}`;
    const whySpeech = cleanSpoken(whyEl.innerText || whyEl.textContent || '');

    formulaEl.classList.add('cur');
    await speakText(formulaSpeech, seq);
    if(seq !== speakSeq) return;
    formulaEl.classList.remove('cur');

    await waitPause(1500, seq);

    whyEl.classList.add('cur');
    await speakText(whySpeech, seq);
    if(seq !== speakSeq) return;
    whyEl.classList.remove('cur');
  } else {
    const raw = cleanSpoken(msgEl.innerText || msgEl.textContent || '');
    await speakText(raw, seq);
  }

  if(seq === speakSeq && btn) btn.classList.remove('on');
}

  if ($('#homeError')) $('#homeError').classList.add('hidden');
  if ($('#charInput')) $('#charInput').value = input;
  if ($('#homeCharInput')) $('#homeCharInput').value = input;

  try {
    setLoading(true, `正在載入「${input}」精選字族的繁體向量筆順...`, 40);
    const newD = JSON.parse(JSON.stringify(PRESET_FAMILIES[input]));

    D = newD;
    round = 0;

    setLoading(false);

    setLoading(false);
    showHomeError(err.message);

        <div class="flex items-center gap-1.5">
          <span class="text-xs font-bold text-gray-500">語詞:</span>
          <input type="text" data-field="word" data-r="${rIdx}" value="${r.word}" class="w-24 px-2 py-0.5 rounded border font-bold">
          <input type="text" data-field="wordZ" data-r="${rIdx}" value="${r.wordZ}" class="flex-1 px-2 py-0.5 rounded border text-xs">
        </div>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.editor-svg path[data-k]').forEach(p => {
    p.addEventListener('click', () => {
      const rIdx = +p.dataset.r, k = +p.dataset.k;
      const r = D.rounds[rIdx];
      const pos = r.pi.indexOf(k);
      if (pos >= 0) {
        if (r.pi.length > 1) r.pi.splice(pos, 1);
      } else {
        r.pi.push(k);
        r.pi.sort((a,b)=>a-b);
      }
      const isPart = r.pi.includes(k);
      p.setAttribute('fill', isPart ? '#ef5a0c' : '#1d63d8');
      r.rb = computePartBBox(strokes(r.ch), r.pi);
      SFX.select();
    });
  });

  $('#editorModal').classList.remove('hidden');
}

bindClick('#editPartsBtn', () => { ac(); openEditor(); });
bindClick('#closeEditorBtn', () => $('#editorModal')?.classList.add('hidden'));
bindClick('#saveEditorBtn', () => {
  ac();
  $('#editorList').querySelectorAll('input[data-field]').forEach(inp => {
    const rIdx = +inp.dataset.r, field = inp.dataset.field;
    D.rounds[rIdx][field] = inp.value.trim();
  });
  $('#editorModal').classList.add('hidden');
  round = 0;
  openStudyScreen(true);
});

function exportStandaloneHTML() {
  ac();
  try {
    // 1. 直接從原始 DOM 複製，保留課前教材預習畫面與遊戲主畫面，僅移除 AI 生成與編輯器視窗
    const cloneDoc = document.documentElement.cloneNode(true);
    cloneDoc.querySelectorAll('#homeScreen, #backHomeBtn, #charInput, #genBtn, #editPartsBtn, #exportBtn, #reviewModal, #loadingModal, #editorModal, #exportFinalBtn, #finalHomeBtn').forEach(el => el.remove());

    // 讓頂部工具列只保留「📖 複習教材」按鈕供學生隨時複習
    const gameBarEl = cloneDoc.querySelector('#gameBar');
    if (gameBarEl) {
      gameBarEl.querySelectorAll('div').forEach(d => {
        if (!d.querySelector('#openStudyBtn')) d.remove();
      });
    }

    // 清空匯出瞬間殘留的動態 DOM 狀態
    ['#studyGrid', '#scene', '#sentence', '#word', '#gridwrap', '#tray', '#zhuyin', '#formula', '#stars', '#bubble'].forEach(sel => {
      const el = cloneDoc.querySelector(sel);
      if (el) el.innerHTML = '';
    });
    const overlayEl = cloneDoc.querySelector('#overlay');
    if (overlayEl) overlayEl.classList.add('hidden');

    // 2. 在 <body> 最前面安全注入獨立題庫資料
    const safeJSON = JSON.stringify(D).replace(/<\/script>/gi, '<\\/script>');
    const initScript = document.createElement('script');
    initScript.textContent = `window.__STANDALONE_D__ = ${safeJSON};`;
    const cloneBody = cloneDoc.querySelector('body');
    if (cloneBody) {
      cloneBody.insertBefore(initScript, cloneBody.firstChild);
    }

    const htmlContent = '<!DOCTYPE html>\n<html lang="zh-Hant">\n' + cloneDoc.innerHTML + '\n</html>';
    const fileName = `${(D.title || '形近字家族拼拼樂').replace(/[\\/:*?"<>|]/g, '_')}.html`;

    // 3. 觸發檔案下載
    const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = fileName;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      a.remove();
      URL.revokeObjectURL(blobUrl);
    }, 2000);

    SFX.fanfare();
  } catch (err) {
    console.error('匯出失敗:', err);
    say(`匯出時發生小問題：${err.message}`, 'oops', 'oops');
  }
}

bindClick('#exportBtn', exportStandaloneHTML);
bindClick('#exportFinalBtn', exportStandaloneHTML);

window.addEventListener('load', () => {
  if (window.__STANDALONE_D__) {
    D = window.__STANDALONE_D__;
    round = 0;
    openStudyScreen(true);
  } else {
    switchView('home');
  }
});
</script>
